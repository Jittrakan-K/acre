name: Publish Firestore rules

# Publishes firestore.rules whenever it changes on main, or by hand from the Actions tab.
# If the rules do not compile, Firebase refuses them, this run turns red and the old rules stay.
on:
  push:
    branches: [main]
    paths:
      - firestore.rules
      - .github/workflows/firestore-rules.yml
  workflow_dispatch:

concurrency:
  group: firestore-rules
  cancel-in-progress: false

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Write the service account key
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then echo "::error::Secret FIREBASE_SERVICE_ACCOUNT is missing."; exit 1; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - name: Publish firestore.rules
        run: npx --yes firebase-tools@13 deploy --only firestore:rules --project orbray-techno-achievements --non-interactive
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
